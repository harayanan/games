<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Sticks — Think Like a Doctor</title>
<meta name="description" content="A biology quiz game for kids: spin, draw a stick, answer, and learn how the human body works.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
</head>
<body>
  <header class="bar">
    <button class="brand" id="homeBtn" type="button" aria-label="Body Sticks home">
      <span class="brand-mark" aria-hidden="true">
        <i style="background:var(--green)"></i><i style="background:var(--red)"></i><i style="background:var(--blue)"></i>
      </span>
      Body Sticks
    </button>
    <button class="ghost" id="mapBtn" type="button">Body map</button>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="modal" class="modal" hidden></div>
  <script src="app.js"></script>
</body>
</html>
