<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piggy Bank Quest — The Great Bicycle Save</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
  background: linear-gradient(160deg, #FFF3D6 0%, #FFE3EC 55%, #DFF3FF 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 14px;
  color: #4A3728;
}

#app { width: 100%; max-width: 560px; }

/* ---------- HUD ---------- */
.hud {
  background: rgba(255,255,255,0.85);
  border-radius: 20px;
  padding: 14px 16px;
  box-shadow: 0 4px 14px rgba(120, 70, 20, 0.12);
  margin-bottom: 14px;
}
.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.game-title { font-size: 1.25rem; font-weight: 700; }
.week-badge {
  background: #4A3728;
  color: #FFE9B8;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 5px 12px;
  border-radius: 999px;
}
.sound-btn {
  border: none;
  background: none;
  font-size: 1.3rem;
  cursor: pointer;
  margin-left: 8px;
}

/* savings track: piggy rides toward the bicycle */
.track-wrap { margin: 4px 0 12px; }
.track-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 600;
  color: #8A6D52;
  margin-bottom: 2px;
}
.track {
  position: relative;
  height: 34px;
  background: #EFDFC8;
  border-radius: 999px;
  overflow: visible;
}
.track-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, #FFB1C8, #F06292);
  border-radius: 999px;
  width: 0%;
  transition: width 0.8s ease;
}
.track-piggy {
  position: absolute;
  top: -9px;
  font-size: 1.7rem;
  transform: translateX(-50%) scaleX(-1);
  transition: left 0.8s ease;
  left: 0%;
}
.track-bike {
  position: absolute;
  right: 6px;
  top: -6px;
  font-size: 1.6rem;
}

.money-row { display: flex; gap: 10px; }
.money-box {
  flex: 1;
  border-radius: 16px;
  padding: 10px 12px;
  text-align: center;
  border: 3px solid;
}
.money-box .label { font-size: 0.8rem; font-weight: 600; opacity: 0.75; }
.money-box .amount { font-size: 1.5rem; font-weight: 700; }
.wallet-box { background: #FFF8E1; border-color: #F0B429; }
.bank-box   { background: #FFE9F0; border-color: #F06292; position: relative; }
.bank-box .sub { font-size: 0.7rem; font-weight: 600; color: #B23A6B; }

/* ---------- Card ---------- */
.card {
  background: #ffffff;
  border-radius: 24px;
  padding: 26px 22px 22px;
  box-shadow: 0 8px 24px rgba(120, 70, 20, 0.16);
  text-align: center;
  min-height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  animation: cardIn 0.35s ease;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.card-emoji {
  font-size: 3.4rem;
  line-height: 1.1;
  margin-bottom: 10px;
  display: inline-block;
  animation: bounceIn 0.5s ease;
}
@keyframes bounceIn {
  0% { transform: scale(0.3); }
  60% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.card-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
.card-text { font-size: 1.05rem; line-height: 1.45; color: #6B5340; }
.card-text .money { font-weight: 700; color: #2E9E5B; }
.card-text .cost { font-weight: 700; color: #D96C2C; }

/* floating money popup */
.float-money {
  position: absolute;
  left: 50%;
  top: 40%;
  transform: translateX(-50%);
  font-size: 1.6rem;
  font-weight: 700;
  color: #2E9E5B;
  pointer-events: none;
  animation: floatUp 1.1s ease forwards;
  text-shadow: 0 2px 0 #fff;
}
.float-money.spend { color: #D96C2C; }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 10px); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60px); }
}

/* ---------- Buttons ---------- */
.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}
.btn {
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 600;
  padding: 14px 18px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  color: #fff;
  background: #3B82C4;
  box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
.btn:disabled { background: #C9BCAE; box-shadow: 0 4px 0 rgba(0,0,0,0.08); cursor: not-allowed; }
.btn-green { background: #2E9E5B; }
.btn-orange { background: #E8862E; }
.btn-pink { background: #E0517E; }
.btn-grey { background: #8A7B6C; }
.btn-big { font-size: 1.2rem; padding: 16px 22px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn small { display: block; font-size: 0.75rem; font-weight: 500; opacity: 0.9; }

/* ---------- Tip bar ---------- */
.tip-bar {
  margin-top: 14px;
  background: rgba(255,255,255,0.7);
  border-left: 5px solid #F0B429;
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.88rem;
  font-weight: 500;
  color: #7A5F45;
}

/* ---------- Confetti ---------- */
#confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}
.confetti-piece {
  position: absolute;
  top: -20px;
  width: 12px;
  height: 18px;
  border-radius: 3px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); }
}

.stat-table {
  margin: 14px auto 0;
  text-align: left;
  font-size: 0.95rem;
  border-collapse: collapse;
}
.stat-table td { padding: 4px 10px; }
.stat-table td:last-child { font-weight: 700; text-align: right; }

@media (max-width: 400px) {
  .card-emoji { font-size: 2.8rem; }
  .card-title { font-size: 1.15rem; }
  .btn { font-size: 0.95rem; }
}
</style>
</head>
<body>
<div id="confetti-layer"></div>
<div id="app">
  <div class="hud">
    <div class="hud-top">
      <div class="game-title">🐷 Piggy Bank Quest</div>
      <div>
        <span class="week-badge" id="weekBadge">Week 1 of 12</span>
        <button class="sound-btn" id="soundBtn" title="Sound on/off">🔊</button>
      </div>
    </div>
    <div class="track-wrap">
      <div class="track-label">
        <span>Bicycle fund</span>
        <span id="goalLabel">₹0 / ₹750</span>
      </div>
      <div class="track">
        <div class="track-fill" id="trackFill"></div>
        <div class="track-piggy" id="trackPiggy">🐷</div>
        <div class="track-bike">🚲</div>
      </div>
    </div>
    <div class="money-row">
      <div class="money-box wallet-box">
        <div class="label">👛 Wallet (spending)</div>
        <div class="amount" id="walletAmt">₹0</div>
      </div>
      <div class="money-box bank-box">
        <div class="label">🐷 Piggy Bank (bike fund)</div>
        <div class="amount" id="bankAmt">₹0</div>
        <div class="sub">grows 10% every week!</div>
      </div>
    </div>
  </div>

  <div class="card" id="card"></div>
  <div class="choices" id="choices"></div>
  <div class="tip-bar" id="tipBar"></div>
</div>

<script>
/* =========================================================
   PIGGY BANK QUEST
   A 12-week saving adventure for kids.
   Concepts taught: earning, saving, needs vs wants,
   budgeting, interest, delayed gratification.
   ========================================================= */

const GOAL = 750;        // cost of the bicycle
const WEEKS = 12;
const ALLOWANCE = 60;
const INTEREST = 0.10;   // weekly, exaggerated so kids can SEE growth

/* ---------------- Data pools (easy to edit) ---------------- */

const CHORES = [
  { emoji: "🍽️", text: "Wash the dishes after dinner", pay: 15 },
  { emoji: "🧹", text: "Sweep the living room floor", pay: 20 },
  { emoji: "🚗", text: "Help wash the family car", pay: 30 },
  { emoji: "🌱", text: "Water all the plants", pay: 10 },
  { emoji: "🐕", text: "Walk the neighbour's dog", pay: 25 },
  { emoji: "🛏️", text: "Clean up your room", pay: 20 },
  { emoji: "🍳", text: "Help make breakfast", pay: 15 },
  { emoji: "📦", text: "Help carry the groceries in", pay: 15 }
];

const WANTS = [
  { emoji: "🍦", item: "a double-scoop ice cream", cost: 40 },
  { emoji: "🍬", item: "a big bag of candy", cost: 25 },
  { emoji: "🪁", item: "a shiny new kite", cost: 60 },
  { emoji: "📚", item: "a comic book", cost: 50 },
  { emoji: "🧸", item: "a squishy soft toy", cost: 55 },
  { emoji: "🎮", item: "a weekend video-game rental", cost: 45 },
  { emoji: "🎬", item: "a movie ticket", cost: 70 },
  { emoji: "✨", item: "a pack of glitter stickers", cost: 30 }
];

const NEEDS = [
  { emoji: "✏️", text: "School is starting — you need pencils and notebooks.", cost: 35 },
  { emoji: "🥤", text: "Your water bottle cracked. You need a new one for school.", cost: 30 },
  { emoji: "🚌", text: "The class trip needs a contribution from everyone.", cost: 50 },
  { emoji: "🧦", text: "Your socks have holes. Time for new ones.", cost: 25 },
  { emoji: "📓", text: "You need chart paper and glue for a school project.", cost: 40 }
];

const SURPRISES = [
  { emoji: "🎂", text: "It's your birthday! Grandma sends you a gift of money.", amount: 100 },
  { emoji: "🧧", text: "Festival time! Relatives give you shagun.", amount: 80 },
  { emoji: "🏆", text: "Your drawing won the school art prize!", amount: 50 },
  { emoji: "🧥", text: "You find forgotten cash in your old jacket pocket!", amount: 20 }
];

const QUIETS = [
  { emoji: "😊", text: "A calm week at school. Your friend shares a snack for free." },
  { emoji: "🛝", text: "You play in the park all weekend. Free fun is still fun!" },
  { emoji: "📖", text: "Library week! You read three comics without spending a rupee." },
  { emoji: "✈️", text: "You make paper planes with friends. The best things are free." }
];

const QUIZZES = [
  { q: "Which one of these is a NEED?", a: ["School lunch", "A video game", "Candy"], c: 0,
    why: "A need is something you must have to live and grow — like food, water, and school." },
  { q: "What does SAVING money mean?", a: ["Keeping it to use later", "Spending it right away", "Hiding it forever"], c: 0,
    why: "Saving means keeping some money now so you can use it for something later." },
  { q: "What is a BUDGET?", a: ["A plan for your money", "A kind of candy", "A piggy's dance"], c: 0,
    why: "A budget is a plan: how much comes in, how much to save, and how much to spend." },
  { q: "What is INTEREST?", a: ["Bonus money the bank adds to your savings", "Money you pay the bank", "A boring feeling"], c: 0,
    why: "When you save in a bank, the bank adds a little extra. Your money makes more money!" },
  { q: "Which one of these is a WANT?", a: ["Ice cream", "Medicine", "School shoes"], c: 0,
    why: "A want is something fun that you can live without — like ice cream and toys." },
  { q: "You want a big, expensive toy. What's the smartest plan?", a: ["Save a little every week", "Ask for it loudly every day", "Spend all your money today"], c: 0,
    why: "Saving a little every week adds up to big things. That's how you bought... well, a bicycle soon!" },
  { q: "How do kids usually EARN money?", a: ["Doing chores and small jobs", "Finding it on the road", "Watching TV"], c: 0,
    why: "Money is earned by doing work — chores at home are a kid's first job." },
  { q: "Why is a bank safer than a drawer for savings?", a: ["It can't get lost or stolen — and it grows", "Banks are shiny", "No reason at all"], c: 0,
    why: "Banks keep money safe AND pay interest, so savings grow over time." }
];

const TIPS = [
  "Pay yourself first — save a little before you spend anything.",
  "Needs keep you safe and healthy. Wants are just for fun.",
  "₹10 saved every week becomes ₹520 in a year!",
  "Interest is the bank saying thank you for saving.",
  "Before you buy, ask: do I need it, or do I just want it?",
  "Money you spend is gone. Money you save keeps working for you.",
  "Doing chores is how kids earn their own money.",
  "Big goals are reached one small coin at a time.",
  "You can't spend the same coin twice — choose what matters most.",
  "Real banks add a little interest every year. Saving still grows!",
  "Watching your savings grow feels even better than candy.",
  "A goal makes saving easier. Yours is a shiny red bicycle!"
];

/* ---------------- Game state ---------------- */

let S;
function newState() {
  return {
    week: 1,
    wallet: 0,
    piggy: 0,
    // stats for the end screens
    earnedChores: 0, earnedQuiz: 0, earnedAllowance: 0, earnedSurprise: 0,
    interestEarned: 0, spentWants: 0, spentNeeds: 0, smartMoves: 0,
    quizDeck: shuffle(QUIZZES.slice()),
    choreDeck: shuffle(CHORES.slice()),
    wantDeck: shuffle(WANTS.slice()),
    needDeck: shuffle(NEEDS.slice()),
    surpriseDeck: shuffle(SURPRISES.slice()),
    quietDeck: shuffle(QUIETS.slice())
  };
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function draw(deckName, source) {
  if (S[deckName].length === 0) S[deckName] = shuffle(source.slice());
  return S[deckName].pop();
}

/* ---------------- Sound (tiny WebAudio beeps) ---------------- */

let audioCtx = null;
let muted = false;
function tone(freq, dur = 0.12, delay = 0, type = "sine", vol = 0.12) {
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + delay);
    o.stop(audioCtx.currentTime + delay + dur);
  } catch (e) { /* no audio — fine */ }
}
const sndCoin   = () => { tone(880, 0.09); tone(1318, 0.14, 0.08); };
const sndSad    = () => { tone(330, 0.18, 0, "triangle"); tone(247, 0.25, 0.15, "triangle"); };
const sndPop    = () => tone(520, 0.06, 0, "square", 0.06);
const sndFanfare= () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, i * 0.14, "triangle", 0.14)); };

document.getElementById("soundBtn").addEventListener("click", () => {
  muted = !muted;
  document.getElementById("soundBtn").textContent = muted ? "🔇" : "🔊";
});

/* ---------------- HUD rendering ---------------- */

function rupee(n) { return "₹" + n; }

function renderHUD() {
  document.getElementById("weekBadge").textContent = "Week " + S.week + " of " + WEEKS;
  document.getElementById("walletAmt").textContent = rupee(S.wallet);
  document.getElementById("bankAmt").textContent = rupee(S.piggy);
  const pct = Math.min(1, S.piggy / GOAL);
  document.getElementById("trackFill").style.width = (pct * 100) + "%";
  document.getElementById("trackPiggy").style.left = (pct * 96 + 2) + "%";
  document.getElementById("goalLabel").textContent = rupee(S.piggy) + " / " + rupee(GOAL);
}

function setTip(text) {
  document.getElementById("tipBar").innerHTML = "💡 <b>Money tip:</b> " + text;
}

function floatMoney(text, isSpend) {
  const el = document.createElement("div");
  el.className = "float-money" + (isSpend ? " spend" : "");
  el.textContent = text;
  document.getElementById("card").appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

/* ---------------- Card + button helper ---------------- */

function showCard(opts) {
  const card = document.getElementById("card");
  card.innerHTML = "";
  // retrigger entrance animation
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "";
  if (opts.emoji) {
    const e = document.createElement("div");
    e.className = "card-emoji";
    e.textContent = opts.emoji;
    card.appendChild(e);
  }
  if (opts.title) {
    const t = document.createElement("div");
    t.className = "card-title";
    t.innerHTML = opts.title;
    card.appendChild(t);
  }
  if (opts.text) {
    const p = document.createElement("div");
    p.className = "card-text";
    p.innerHTML = opts.text;
    card.appendChild(p);
  }
  if (opts.extra) card.appendChild(opts.extra);

  const box = document.getElementById("choices");
  box.innerHTML = "";
  (opts.buttons || []).forEach(b => {
    const btn = document.createElement("button");
    btn.className = "btn " + (b.cls || "");
    btn.innerHTML = b.label;
    if (b.disabled) btn.disabled = true;
    btn.addEventListener("click", () => { if (!muted) sndPop(); b.onClick(); });
    box.appendChild(btn);
  });
}

/* ---------------- Game flow ---------------- */

function startGame() {
  S = newState();
  setTip(TIPS[Math.floor(Math.random() * TIPS.length)]);
  renderHUD();
  showCard({
    emoji: "🚲",
    title: "The Great Bicycle Save",
    text: "At Sharma Cycles shines a <b>red bicycle</b>. It costs <span class='cost'>₹750</span>.<br><br>" +
          "You get <span class='money'>₹60</span> pocket money every week for <b>12 weeks</b>. " +
          "Do chores to earn more. Put savings in your piggy bank — it grows <b>10% every week</b>!<br><br>" +
          "Can you save enough before the weeks run out?",
    buttons: [{ label: "Start the adventure!", cls: "btn-green btn-big", onClick: weekAllowance }]
  });
}

function weekAllowance() {
  renderHUD();
  showCard({
    emoji: "💰",
    title: "Week " + S.week + " — Pocket money day!",
    text: "Amma and Appa give you <span class='money'>₹" + ALLOWANCE + "</span> for the week.",
    buttons: [{ label: "Take it!", cls: "btn-green", onClick: () => {
      S.wallet += ALLOWANCE;
      S.earnedAllowance += ALLOWANCE;
      sndCoin();
      floatMoney("+" + rupee(ALLOWANCE));
      renderHUD();
      setTimeout(choreStep, 650);
    } }]
  });
}

function choreStep() {
  const chore = draw("choreDeck", CHORES);
  showCard({
    emoji: chore.emoji,
    title: "Chore chance!",
    text: chore.text + " and earn <span class='money'>₹" + chore.pay + "</span>.",
    buttons: [
      { label: "Do it — earn ₹" + chore.pay, cls: "btn-green", onClick: () => {
        S.wallet += chore.pay;
        S.earnedChores += chore.pay;
        S.smartMoves++;
        sndCoin();
        floatMoney("+" + rupee(chore.pay));
        renderHUD();
        setTimeout(() => feedback(
          "💪", "Work done!",
          "You earned <span class='money'>₹" + chore.pay + "</span>. Money is earned by working — nice job!",
          eventStep), 650);
      } },
      { label: "Not today", cls: "btn-grey", onClick: eventStep }
    ]
  });
}

function eventStep() {
  // A money quiz lands every 3rd week; other weeks draw a random event.
  if (S.week % 3 === 0 && S.quizDeck.length > 0) return quizEvent();
  const r = Math.random();
  if (r < 0.35) return wantEvent();
  if (r < 0.60) return needEvent();
  if (r < 0.75) return surpriseEvent();
  return quietEvent();
}

function wantEvent() {
  const w = draw("wantDeck", WANTS);
  const canAfford = S.wallet >= w.cost;
  showCard({
    emoji: w.emoji,
    title: "Ooh, tempting…",
    text: "The shop has <b>" + w.item + "</b> for <span class='cost'>₹" + w.cost + "</span>.<br>" +
          "It's a <b>want</b>, not a need. Your call!",
    buttons: [
      { label: "Buy it (₹" + w.cost + ")" + (canAfford ? "" : "<small>not enough cash in wallet!</small>"),
        cls: "btn-orange", disabled: !canAfford, onClick: () => {
          S.wallet -= w.cost;
          S.spentWants += w.cost;
          sndSad();
          floatMoney("−" + rupee(w.cost), true);
          renderHUD();
          setTimeout(() => feedback(
            w.emoji, "Bought it.",
            "Fun for a moment… but the bicycle is now <span class='cost'>₹" + w.cost + "</span> further away.",
            depositStep), 650);
        } },
      { label: "Skip it — save for the bike!", cls: "btn-green", onClick: () => {
        S.smartMoves++;
        sndCoin();
        feedback("🏆", "Strong choice!",
          "You walked past a want. That <span class='money'>₹" + w.cost + "</span> stays with you — and the bike gets closer.",
          depositStep);
      } }
    ]
  });
}

function needEvent() {
  const n = draw("needDeck", NEEDS);
  showCard({
    emoji: n.emoji,
    title: "This is a need…",
    text: n.text + " It costs <span class='cost'>₹" + n.cost + "</span>.<br>Needs must be paid — that's life!",
    buttons: [{ label: "Pay ₹" + n.cost, cls: "btn-orange", onClick: () => {
      let left = n.cost;
      const fromWallet = Math.min(S.wallet, left);
      S.wallet -= fromWallet; left -= fromWallet;
      let brokePiggy = false, parentsHelped = false;
      if (left > 0) {
        const fromPiggy = Math.min(S.piggy, left);
        if (fromPiggy > 0) brokePiggy = true;
        S.piggy -= fromPiggy; left -= fromPiggy;
      }
      if (left > 0) parentsHelped = true; // parents cover the rest, no debt for kids
      S.spentNeeds += n.cost - left;
      sndSad();
      floatMoney("−" + rupee(n.cost - left), true);
      renderHUD();
      let msg = "Paid from your wallet.";
      if (brokePiggy) msg = "Your wallet ran short, so some came <b>out of the piggy bank</b>. That's why we keep a little cash ready for needs!";
      if (parentsHelped) msg = "You didn't have enough, so Amma and Appa covered the rest. Needs can surprise you — keep some money aside!";
      setTimeout(() => feedback("🧾", "Need paid.", msg, depositStep), 650);
    } }]
  });
}

function surpriseEvent() {
  const s = draw("surpriseDeck", SURPRISES);
  showCard({
    emoji: s.emoji,
    title: "Lucky you!",
    text: s.text + " <span class='money'>+₹" + s.amount + "</span>",
    buttons: [{ label: "Hooray!", cls: "btn-green", onClick: () => {
      S.wallet += s.amount;
      S.earnedSurprise += s.amount;
      sndCoin();
      floatMoney("+" + rupee(s.amount));
      renderHUD();
      setTimeout(depositStep, 650);
    } }]
  });
}

function quietEvent() {
  const q = draw("quietDeck", QUIETS);
  showCard({
    emoji: q.emoji,
    title: "A peaceful week",
    text: q.text,
    buttons: [{ label: "Nice.", cls: "", onClick: depositStep }]
  });
}

function quizEvent() {
  const q = S.quizDeck.pop();
  // shuffle answer order so the right one isn't always first
  const order = shuffle(q.a.map((ans, i) => ({ ans, correct: i === q.c })));
  const buttons = order.map(o => ({
    label: o.ans, cls: "",
    onClick: () => {
      if (o.correct) {
        S.wallet += 25;
        S.earnedQuiz += 25;
        S.smartMoves++;
        sndCoin();
        floatMoney("+₹25");
        renderHUD();
        setTimeout(() => feedback(
          "🌟", "Money-smart! +₹25",
          q.why + "<br><br>You earned <span class='money'>₹25</span> for knowing your stuff!",
          depositStep), 650);
      } else {
        sndSad();
        feedback("🤔", "Good try!",
          q.why + "<br><br>No prize this time — but now you know!",
          depositStep);
      }
    }
  }));
  showCard({
    emoji: "🧠",
    title: "Money-Smart Moment!",
    text: "Answer right and earn <span class='money'>₹25</span>!<br><br><b>" + q.q + "</b>",
    buttons: buttons
  });
}

function depositStep() {
  const opts = [];
  const add = (amt, label, cls) => {
    if (S.wallet >= amt && amt > 0) {
      opts.push({ label: label || ("Save ₹" + amt), cls: cls || "btn-green", onClick: () => doDeposit(amt) });
    }
  };
  add(10); add(25); add(50);
  if (S.wallet > 0) add(S.wallet, "Save it ALL! (₹" + S.wallet + ")", "btn-pink");
  opts.push({ label: "Keep it all in my wallet", cls: "btn-grey", onClick: () => doDeposit(0) });

  showCard({
    emoji: "🐷",
    title: "Feed the piggy bank?",
    text: "You have <span class='money'>₹" + S.wallet + "</span> in your wallet.<br>" +
          "Money in the piggy bank grows <b>10% every week</b> — that's your bicycle fund!<br>" +
          "Money in the wallet can be spent on wants… and eaten by needs.",
    buttons: opts
  });
}

function doDeposit(amt) {
  if (amt > 0) {
    S.wallet -= amt;
    S.piggy += amt;
    S.smartMoves++;
    sndCoin();
    floatMoney("🐷 +" + rupee(amt));
    renderHUD();
    setTimeout(weekSummary, 650);
  } else {
    weekSummary();
  }
}

function weekSummary() {
  // interest on the piggy bank at end of week
  const before = S.piggy;
  const gained = Math.floor(S.piggy * INTEREST);
  if (gained > 0) {
    S.piggy += gained;
    S.interestEarned += gained;
  }
  renderHUD();

  // win check
  if (S.piggy >= GOAL) return winScreen();

  const isLast = S.week >= WEEKS;
  let interestLine = gained > 0
    ? "The bank added <span class='money'>₹" + gained + "</span> interest — your savings grew from ₹" + before + " to <b>₹" + S.piggy + "</b> while you slept!<br><br>"
    : "No interest this week — money only grows when it's IN the piggy bank.<br><br>";

  showCard({
    emoji: gained > 0 ? "🌱" : "🌙",
    title: "Week " + S.week + " done",
    text: interestLine +
          "Bicycle fund: <b>" + rupee(S.piggy) + " of " + rupee(GOAL) + "</b>. " +
          (isLast ? "This was the last week…" : (WEEKS - S.week) + " weeks left!"),
    buttons: [{ label: isLast ? "See how I did" : "Start week " + (S.week + 1), cls: "btn-green btn-big",
      onClick: () => {
        if (isLast) return endScreen();
        S.week++;
        setTip(TIPS[Math.floor(Math.random() * TIPS.length)]);
        renderHUD();
        weekAllowance();
      } }]
  });
  if (gained > 0) sndCoin();
}

function feedback(emoji, title, text, next) {
  showCard({
    emoji: emoji, title: title, text: text,
    buttons: [{ label: "Continue →", cls: "", onClick: next }]
  });
}

/* ---------------- End screens ---------------- */

function statTable() {
  const rows = [
    ["💰 Pocket money", S.earnedAllowance],
    ["💪 Earned from chores", S.earnedChores],
    ["🧠 Earned from quizzes", S.earnedQuiz],
    ["🎁 Surprise gifts", S.earnedSurprise],
    ["🌱 Interest earned", S.interestEarned],
    ["🍦 Spent on wants", S.spentWants],
    ["🧾 Spent on needs", S.spentNeeds],
    ["🏆 Smart money moves", S.smartMoves]
  ];
  const t = document.createElement("table");
  t.className = "stat-table";
  rows.forEach(([k, v]) => {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.textContent = k;
    const td2 = document.createElement("td");
    td2.textContent = (k.includes("Smart") ? v : rupee(v));
    tr.appendChild(td1); tr.appendChild(td2); t.appendChild(tr);
  });
  return t;
}

function confetti() {
  const layer = document.getElementById("confetti-layer");
  const colors = ["#F06292", "#F0B429", "#2E9E5B", "#3B82C4", "#E0517E", "#8E6BB8"];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (2.2 + Math.random() * 2) + "s";
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    p.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
    layer.appendChild(p);
    setTimeout(() => p.remove(), 5500);
  }
}

function winScreen() {
  sndFanfare();
  confetti();
  showCard({
    emoji: "🚲",
    title: "YOU GOT THE BICYCLE!",
    text: "In <b>week " + S.week + "</b>, your piggy bank reached <span class='money'>₹" + S.piggy + "</span>! " +
          "You earned, you saved, you skipped the small stuff — and now the red bicycle is <b>yours</b>. " +
          "That's how money works: save a little, again and again, and big goals open up.",
    extra: statTable(),
    buttons: [{ label: "Play again", cls: "btn-green btn-big", onClick: startGame }]
  });
}

function endScreen() {
  const short = GOAL - S.piggy;
  showCard({
    emoji: "⏰",
    title: "The 12 weeks are up…",
    text: "Your piggy bank has <b>₹" + S.piggy + "</b> — just <span class='cost'>₹" + short + "</span> short of the bicycle. " +
          "So close! Next time, try doing more chores, feeding the piggy earlier (interest adds up!), " +
          "and walking past a few more wants.<br><br>The bicycle will still be there. Want another go?",
    extra: statTable(),
    buttons: [{ label: "Try again!", cls: "btn-green btn-big", onClick: startGame }]
  });
}

/* ---------------- Go! ---------------- */
startGame();
</script>
</body>
</html>
